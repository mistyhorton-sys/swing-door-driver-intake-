<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbound Driver Safety Intake</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  </head>
  <body class="bg-white text-gray-800 min-h-screen">
    <main class="max-w-xl mx-auto p-4 sm:p-6">
      <section class="rounded-xl border border-gray-200 p-4 sm:p-6 shadow-sm">
        <h1 id="title" class="text-2xl font-bold mb-2 text-[#0053e2]">Inbound Driver Safety Intake</h1>
        <p id="subtitle" class="mb-6 text-gray-700">Please submit required photos before unloading.</p>

        <form
          id="intakeForm"
          class="space-y-4"
          enctype="multipart/form-data"
          method="POST"
          action="https://formsubmit.co/6077cro@walmart.com"
        >
          <input type="hidden" name="_subject" value="Door Safety Intake Submission" />
          <input type="hidden" name="_template" value="table" />
          <input type="hidden" name="_captcha" value="false" />
          <input type="hidden" name="_next" id="nextField" value="" />

          <div>
            <label for="language" id="language_label" class="block mb-1 font-medium">Language</label>
            <select id="language" name="language" class="w-full border border-gray-300 rounded-lg p-2" required>
              <option value="en">English</option>
              <option value="es">Español</option>
              <option value="fr">Français</option>
              <option value="ht">Kreyòl Ayisyen</option>
            </select>
          </div>

          <div>
            <label for="door_number" id="door_label" class="block mb-1 font-medium">Door Number</label>
            <input id="door_number" name="door_number" class="w-full border border-gray-300 rounded-lg p-2" required />
          </div>

          <div>
            <label for="driver_name" id="driver_label" class="block mb-1 font-medium">Driver Name (optional)</label>
            <input id="driver_name" name="driver_name" class="w-full border border-gray-300 rounded-lg p-2" />
          </div>

          <div>
            <label for="trailer_number" id="trailer_label" class="block mb-1 font-medium">Trailer Number (optional)</label>
            <input id="trailer_number" name="trailer_number" class="w-full border border-gray-300 rounded-lg p-2" />
          </div>

          <div>
            <label for="door_photo" id="door_photo_label" class="block mb-1 font-medium">Photo 1: Door</label>
            <input id="door_photo" name="door_photo" type="file" accept="image/*" capture="environment" class="w-full border border-gray-300 rounded-lg p-2" required />
          </div>

          <div>
            <label for="disconnected_trailer_photo" id="trailer_photo_label" class="block mb-1 font-medium">Photo 2: Disconnected Trailer</label>
            <input id="disconnected_trailer_photo" name="disconnected_trailer_photo" type="file" accept="image/*" capture="environment" class="w-full border border-gray-300 rounded-lg p-2" required />
          </div>

          <div>
            <label for="chocked_wheels_photo" id="chock_photo_label" class="block mb-1 font-medium">Photo 3: Chocked Wheels</label>
            <input id="chocked_wheels_photo" name="chocked_wheels_photo" type="file" accept="image/*" capture="environment" class="w-full border border-gray-300 rounded-lg p-2" required />
          </div>

          <button id="submitBtn" type="submit" class="w-full bg-[#0053e2] hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg">
            Submit
          </button>

          <p id="status" aria-live="polite" class="text-sm text-[#995213]"></p>
        </form>
      </section>

      <section class="mt-4 rounded-xl border border-gray-200 p-4">
        <h2 class="font-semibold text-[#0053e2] mb-2">QR Code for this form</h2>
        <div id="qr" class="w-48 h-48 border border-gray-200 rounded flex items-center justify-center"></div>
      </section>
    </main>

    <script>
      const dictionary = {
        en: {
          title: "Inbound Driver Safety Intake",
          subtitle: "Please submit required photos before unloading.",
          languageLabel: "Language",
          doorLabel: "Door Number",
          driverLabel: "Driver Name (optional)",
          trailerLabel: "Trailer Number (optional)",
          doorPhoto: "Photo 1: Door",
          trailerPhoto: "Photo 2: Disconnected Trailer",
          chockPhoto: "Photo 3: Chocked Wheels",
          submit: "Submit",
          sending: "Submitting...",
        },
        es: {
          title: "Registro de Seguridad para Conductores",
          subtitle: "Envíe las fotos requeridas antes de descargar.",
          languageLabel: "Idioma",
          doorLabel: "Número de puerta",
          driverLabel: "Nombre del conductor (opcional)",
          trailerLabel: "Número del remolque (opcional)",
          doorPhoto: "Foto 1: Puerta",
          trailerPhoto: "Foto 2: Remolque desconectado",
          chockPhoto: "Foto 3: Ruedas con cuñas",
          submit: "Enviar",
          sending: "Enviando...",
        },
        fr: {
          title: "Formulaire Sécurité Conducteur",
          subtitle: "Veuillez soumettre les photos requises avant le déchargement.",
          languageLabel: "Langue",
          doorLabel: "Numéro de quai",
          driverLabel: "Nom du conducteur (optionnel)",
          trailerLabel: "Numéro de remorque (optionnel)",
          doorPhoto: "Photo 1 : Quai",
          trailerPhoto: "Photo 2 : Remorque déconnectée",
          chockPhoto: "Photo 3 : Roues calées",
          submit: "Soumettre",
          sending: "Envoi en cours...",
        },
        ht: {
          title: "Fòm Sekirite Chofè Antre",
          subtitle: "Soumèt foto obligatwa yo anvan dechajman.",
          languageLabel: "Lang",
          doorLabel: "Nimewo pòt",
          driverLabel: "Non chofè (opsyonèl)",
          trailerLabel: "Nimewo trelè (opsyonèl)",
          doorPhoto: "Foto 1: Pòt",
          trailerPhoto: "Foto 2: Trelè dekonekte",
          chockPhoto: "Foto 3: Wou bloke",
          submit: "Voye",
          sending: "Ap voye...",
        },
      };

      const byId = (id) => document.getElementById(id);

      function applyLanguage(lang) {
        const t = dictionary[lang] || dictionary.en;
        byId("title").textContent = t.title;
        byId("subtitle").textContent = t.subtitle;
        byId("language_label").textContent = t.languageLabel;
        byId("door_label").textContent = t.doorLabel;
        byId("driver_label").textContent = t.driverLabel;
        byId("trailer_label").textContent = t.trailerLabel;
        byId("door_photo_label").textContent = t.doorPhoto;
        byId("trailer_photo_label").textContent = t.trailerPhoto;
        byId("chock_photo_label").textContent = t.chockPhoto;
        byId("submitBtn").textContent = t.submit;
      }

      byId("language").addEventListener("change", (event) => {
        applyLanguage(event.target.value);
      });

      byId("intakeForm").addEventListener("submit", () => {
        const lang = byId("language").value;
        const t = dictionary[lang] || dictionary.en;
        byId("status").textContent = t.sending;
        byId("submitBtn").disabled = true;
      });

      const currentUrl = window.location.href;
      byId("nextField").value = currentUrl;
      QRCode.toCanvas(currentUrl, { width: 192 }, function (_error, canvas) {
        if (canvas) {
          const qrRoot = byId("qr");
          qrRoot.innerHTML = "";
          qrRoot.appendChild(canvas);
        }
      });

      applyLanguage("en");
    </script>
  </body>
</html>

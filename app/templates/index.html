<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbound Driver Safety Intake</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-white text-gray-800 min-h-screen">
    <main class="max-w-xl mx-auto p-4 sm:p-6">
      <section class="rounded-xl border border-gray-200 p-4 sm:p-6 shadow-sm">
        <h1 id="title" class="text-2xl font-bold mb-2 text-[#0053e2]">Inbound Driver Safety Intake</h1>
        <p id="subtitle" class="mb-6 text-gray-700">Please submit required photos before unloading.</p>

        <form id="intakeForm" class="space-y-4" enctype="multipart/form-data">
          <div>
            <label for="language" id="language_label" class="block mb-1 font-medium">Language</label>
            <select id="language" name="language" class="w-full border border-gray-300 rounded-lg p-2" required>
              <option value="en">English</option>
              <option value="es">Español</option>
              <option value="fr">Français</option>
              <option value="ht">Kreyòl Ayisyen</option>
            </select>
          </div>

          <div>
            <label for="door_number" id="door_label" class="block mb-1 font-medium">Door Number</label>
            <input id="door_number" name="door_number" class="w-full border border-gray-300 rounded-lg p-2" required />
          </div>

          <div>
            <label for="driver_name" id="driver_label" class="block mb-1 font-medium">Driver Name (optional)</label>
            <input id="driver_name" name="driver_name" class="w-full border border-gray-300 rounded-lg p-2" />
          </div>

          <div>
            <label for="trailer_number" id="trailer_label" class="block mb-1 font-medium">Trailer Number (optional)</label>
            <input id="trailer_number" name="trailer_number" class="w-full border border-gray-300 rounded-lg p-2" />
          </div>

          <div>
            <label for="door_photo" id="door_photo_label" class="block mb-1 font-medium">Photo 1: Door</label>
            <input id="door_photo" name="door_photo" type="file" accept="image/*" capture="environment" class="w-full border border-gray-300 rounded-lg p-2" required />
          </div>

          <div>
            <label for="disconnected_trailer_photo" id="trailer_photo_label" class="block mb-1 font-medium">Photo 2: Disconnected Trailer</label>
            <input id="disconnected_trailer_photo" name="disconnected_trailer_photo" type="file" accept="image/*" capture="environment" class="w-full border border-gray-300 rounded-lg p-2" required />
          </div>

          <div>
            <label for="chocked_wheels_photo" id="chock_photo_label" class="block mb-1 font-medium">Photo 3: Chocked Wheels</label>
            <input id="chocked_wheels_photo" name="chocked_wheels_photo" type="file" accept="image/*" capture="environment" class="w-full border border-gray-300 rounded-lg p-2" required />
          </div>

          <button id="submitBtn" type="submit" class="w-full bg-[#0053e2] hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg">
            Submit
          </button>

          <p id="status" aria-live="polite" class="text-sm"></p>
        </form>
      </section>

      <section class="mt-4 rounded-xl border border-gray-200 p-4">
        <h2 class="font-semibold text-[#0053e2] mb-2">QR Code for this form</h2>
        <img src="/qr?url={{ public_url }}" alt="QR code linking to intake form" class="w-48 h-48 border border-gray-200 rounded" />
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
